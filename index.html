async function decrypt(){
  var pw=document.getElementById('pwInput').value;
  if(!pw)return;
  document.getElementById('pwErr').style.display='none';
  document.getElementById('pwLoading').style.display='block';
  try{
    var enc=new TextEncoder();
    var km=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
    var k=await crypto.subtle.deriveKey(
      {name:'PBKDF2',salt:Uint8Array.from(atob(_S),function(c){return c.charCodeAt(0)}),iterations:100000,hash:'SHA-256'},
      km,{name:'AES-GCM',length:256},false,['decrypt']
    );
    var iv=Uint8Array.from(atob(_N),function(c){return c.charCodeAt(0)});
    var ct=Uint8Array.from(atob(_C),function(c){return c.charCodeAt(0)});
    var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:iv},k,ct);
    var fullHtml=new TextDecoder().decode(pt);
    
    // Parse the full HTML and extract body content
    var parser=new DOMParser();
    var doc=parser.parseFromString(fullHtml,'text/html');
    
    // Move style elements to head
    var styles=doc.querySelectorAll('style');
    styles.forEach(function(s){
      document.head.appendChild(s.cloneNode(true));
    });
    
    // Get body content
    var el=document.getElementById('decrypted');
    el.innerHTML=doc.body.innerHTML;
    el.style.display='block';
    document.getElementById('pwBox').style.display='none';
    
    // Re-execute scripts
    var scripts=el.querySelectorAll('script');
    for(var i=0;i<scripts.length;i++){
      var old=scripts[i];
      var s=document.createElement('script');
      if(old.src) s.src=old.src;
      else s.text=old.textContent;
      old.parentNode.replaceChild(s,old);
    }
    
    // Poll for data.js to load and call initViewer
    var attempts=0;
    var waitData=setInterval(function(){
      attempts++;
      if(typeof CHAT_DATA!=='undefined' && CHAT_DATA){
        clearInterval(waitData);
        if(typeof initViewer==='function'){
          initViewer();
        }
      }
      if(attempts>600){clearInterval(waitData);}// 60s timeout
    },100);
  }catch(e){
    console.error('Decrypt error:',e);
    document.getElementById('pwLoading').style.display='none';
    document.getElementById('pwErr').style.display='block';
    document.getElementById('pwInput').value='';
    document.getElementById('pwInput').focus();
  }
}
</script>
