async function decrypt(){
  const pw=document.getElementById('pwInput').value;
  if(!pw)return;
  document.getElementById('pwErr').style.display='none';
  document.getElementById('pwLoading').style.display='block';
  try{
    const enc=new TextEncoder();
    const keyMaterial=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey(
      {name:'PBKDF2',salt:Uint8Array.from(atob(SALT),c=>c.charCodeAt(0)),iterations:100000,hash:'SHA-256'},
      keyMaterial,
      {name:'AES-GCM',length:256},
      false,
      ['decrypt']
    );
    const iv=Uint8Array.from(atob(NONCE),c=>c.charCodeAt(0));
    const ct=Uint8Array.from(atob(CIPHER),c=>c.charCodeAt(0));
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct);
    const html=new TextDecoder().decode(pt);
    document.getElementById('decrypted-content').innerHTML=html;
    document.getElementById('pwBox').style.display='none';
    document.getElementById('decrypted-content').style.display='block';
    // Re-execute scripts
    const scripts=document.getElementById('decrypted-content').querySelectorAll('script');
    scripts.forEach(old=>{
      const s=document.createElement('script');
      s.text=old.textContent;
      old.parentNode.replaceChild(s,old);
    });
  }catch(e){
    console.error(e);
    document.getElementById('pwLoading').style.display='none';
    document.getElementById('pwErr').style.display='block';
    document.getElementById('pwInput').value='';
    document.getElementById('pwInput').focus();
  }
}
</script>
